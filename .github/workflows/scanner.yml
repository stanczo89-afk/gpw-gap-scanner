name: GPW Gap Scanner

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "2,7,12 7 * * 1-5"
    - cron: "2,7,12 8 * * 1-5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          FORCE_RUN: "1"
        run: python scanner.py

      - name: Commit updated scan data
        run: |
          if git diff --quiet -- data/latest.json data/history.csv; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "gpw-gap-scanner-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -- data/latest.json data/history.csv
          git commit -m "Update GPW gap scan data"
          git push
